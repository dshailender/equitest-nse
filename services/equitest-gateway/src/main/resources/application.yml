server:
  port: 8080

spring:
  application:
    name: equitest-gateway

services:
  data:
    url: ${DATA_SERVICE_URL:http://localhost:8081}
  engine:
    url: ${ENGINE_SERVICE_URL:http://localhost:8082}
  sweep:
    url: ${SWEEP_SERVICE_URL:http://localhost:8083}
  reports:
    url: ${REPORTS_SERVICE_URL:http://localhost:8084}
  validation:
    url: ${VALIDATION_SERVICE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
