version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: "${GIT_SHA:-unknown}"
    container_name: equitest-backend-prod
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATA_SOURCE=nse
      - DATABASE_URL=sqlite:////app/data/prod.db
      - LOG_LEVEL=INFO
      - MAX_BACKTEST_RUNS=5
      - YFINANCE_ENABLED=true
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - BACKTEST_STORAGE_PATH=/app/data/backtests
      - FIXTURES_DIR=/app/data/fixtures
      - REPO_ROOT=/app
    volumes:
      - db_data:/app/data
      - backtests_data:/app/data/backtests
      - reports_data:/app/data/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - equitest-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    container_name: equitest-frontend-prod
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - equitest-network

volumes:
  db_data:
    name: equitest_prod_db
    driver: local
  backtests_data:
    name: equitest_prod_backtests
    driver: local
  reports_data:
    name: equitest_prod_reports
    driver: local

networks:
  equitest-network:
    name: equitest-prod-net
    driver: bridge
